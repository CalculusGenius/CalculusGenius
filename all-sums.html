    <meta charset="UTF-8">

    <meta

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <div class="logo">
            CALCULUS
        </div>

        <nav class="desktop-nav">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="books.html">Books</a>
            <a href="topics.html">Topics</a>
            <a href="other-websites.html">Other Websites</a>
            <a href="all-sums.html" class="active">All Sums</a>
            <a href="login.html">Log In</a>

        </nav>

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open menu"
        >
            ☰
        </button>

    </header>


    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="books.html">Books</a>
        <a href="topics.html">Topics</a>
        <a href="other-websites.html">
            Other Websites
        </a>
        <a href="all-sums.html">
            All Sums
        </a>
        <a href="login.html">
            Log In
        </a>

    </div>


    <main class="all-sums-page">

        <section class="page-hero">

            <h1>All Sums</h1>

            <p>
                The complete archive of CALCULUS challenges.
            </p>

        </section>


        <section class="sum-filters">

            <button
                class="sum-filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="sum-filter"
                data-filter="daily"
            >
                Daily
            </button>

            <button
                class="sum-filter"
                data-filter="weekly"
            >
                Weekly
            </button>

            <button
                class="sum-filter"
                data-filter="school"
            >
                School
            </button>

            <button
                class="sum-filter"
                data-filter="university"
            >
                University
            </button>

        </section>


        <section
            id="allSumsContainer"
            class="all-sums-container"
        >

            <p class="loading-message">
                Loading sums...
            </p>

        </section>

    </main>


    <script
        type="module"
        src="script.js"
    ></script>

    <script
        type="module"
        src="all-sums.js"
    ></script>
