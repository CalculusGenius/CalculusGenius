<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your CALCULUS account with Google.">

    <title>CALCULUS — Sign Up</title>


    <!-- Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(255,255,255,0.045),
                    transparent 35%
                ),
                #050507;

            color: #ffffff;

            font-family:
                "Inter",
                sans-serif;

            overflow-x: hidden;
        }


        /* =========================================
           MATHEMATICAL BACKGROUND
        ========================================= */

        .math-background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .math-background span {

            position: absolute;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(5rem, 14vw, 13rem);

            font-weight: 500;

            color:
                rgba(255,255,255,0.025);

            user-select: none;
        }


        .math-background span:nth-child(1) {
            top: 5%;
            left: 4%;
        }

        .math-background span:nth-child(2) {
            top: 18%;
            right: 8%;
        }

        .math-background span:nth-child(3) {
            top: 45%;
            left: 18%;
        }

        .math-background span:nth-child(4) {
            top: 62%;
            right: 18%;
        }

        .math-background span:nth-child(5) {
            bottom: 5%;
            left: 5%;
        }

        .math-background span:nth-child(6) {
            bottom: 10%;
            right: 5%;
        }


        /* =========================================
           PAGE
        ========================================= */

        .auth-page {

            position: relative;

            z-index: 2;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                100px 20px 60px;
        }


        /* =========================================
           AUTH CARD
        ========================================= */

        .auth-card {

            width:
                min(480px, 100%);

            padding:
                clamp(2.5rem, 7vw, 4.5rem)
                clamp(1.7rem, 6vw, 4rem);

            text-align: center;

            border:
                1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(255,255,255,0.035);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.55),

                inset 0 0 40px
                rgba(255,255,255,0.012);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            animation:
                cardAppear 1s
                cubic-bezier(.16,1,.3,1);
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           LOGO
        ========================================= */

        .auth-logo {

            width: 58px;

            height: 58px;

            object-fit: contain;

            display: block;

            margin:
                0 auto 2rem;
        }


        /* =========================================
           TITLE
        ========================================= */

        .auth-title {

            margin: 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(2.8rem, 9vw, 4.5rem);

            font-weight: 600;

            line-height: 1;

            letter-spacing:
                0.02em;
        }


        .auth-subtitle {

            margin:
                1rem 0 2.7rem;

            font-size:
                0.95rem;

            line-height: 1.7;

            font-weight: 300;

            color:
                rgba(255,255,255,0.62);
        }


        /* =========================================
           GOOGLE BUTTON
        ========================================= */

        .google-button {

            width: 100%;

            min-height: 54px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            padding:
                0 1.2rem;

            border:
                1px solid
                rgba(255,255,255,0.3);

            background:
                rgba(255,255,255,0.06);

            color: #ffffff;

            font-family:
                "Inter",
                sans-serif;

            font-size:
                0.95rem;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .google-button:hover {

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.55);

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.3);
        }


        .google-button:active {

            transform:
                translateY(0)
                scale(0.985);
        }


        .google-icon {

            width: 20px;

            height: 20px;

            flex-shrink: 0;
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 15px;

            margin:
                2rem 0;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.1);
        }


        .divider span {

            font-size:
                0.72rem;

            color:
                rgba(255,255,255,0.4);

            text-transform:
                uppercase;

            letter-spacing:
                0.12em;
        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .switch-text {

            margin: 0;

            font-size:
                0.9rem;

            color:
                rgba(255,255,255,0.55);
        }


        .switch-text a {

            color: #ffffff;

            font-weight: 500;

            text-decoration:
                underline;

            text-underline-offset:
                4px;

            transition:
                opacity 0.25s ease;
        }


        .switch-text a:hover {

            opacity: 0.65;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .auth-footer {

            position: fixed;

            bottom: 20px;

            left: 0;

            width: 100%;

            text-align: center;

            z-index: 3;
        }


        .auth-footer p {

            margin: 0;

            font-size:
                0.75rem;

            color:
                rgba(255,255,255,0.35);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .auth-page {

                padding:
                    50px 16px 80px;
            }


            .auth-card {

                padding:
                    2.7rem 1.4rem;
            }


            .auth-logo {

                width: 50px;

                height: 50px;
            }

        }

    </style>

</head>


<body>


    <!-- Mathematical background -->

    <div class="math-background"
         aria-hidden="true">

        <span>∫</span>
        <span>∫</span>
        <span>∫</span>
        <span>∫</span>
        <span>∫</span>
        <span>∫</span>
        <span>∫</span>
        <span>∫</span>

    </div>


    <!-- Sign Up -->

    <main class="auth-page">

        <section class="auth-card">


            <img src="logo.png"
                 alt="CALCULUS Logo"
                 class="auth-logo">


            <h1 class="auth-title">
                Create Account
            </h1>


            <p class="auth-subtitle">
                Join CALCULUS and continue
                exploring the world of mathematics.
            </p>


            <button
                class="google-button"
                id="googleSignup">

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <path
                        fill="#4285F4"
                        d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.39z"/>

                    <path
                        fill="#34A853"
                        d="M12 21.6c2.63 0 4.84-.87 6.45-2.35l-3.14-2.43c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.6z"/>

                    <path
                        fill="#FBBC05"
                        d="M6.54 13.72a5.85 5.85 0 0 1 0-3.44v-2.5H3.3a9.65 9.65 0 0 0 0 8.44l3.24-2.5z"/>

                    <path
                        fill="#EA4335"
                        d="M12 6.25c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.83 3.35 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.38l3.24 2.5C7.31 7.97 9.46 6.25 12 6.25z"/>

                </svg>

                Continue with Google

            </button>


            <div class="divider">

                <span>
                    CALCULUS
                </span>

            </div>


            <p class="switch-text">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>


        </section>

    </main>


    <footer class="auth-footer">

        <p>
            © Ankit Brahamachary 2026
        </p>

    </footer>


    <!-- Authentication -->

    <script type="module">

        import {
            signInWithGoogle
        } from "./auth.js";


        document
            .getElementById("googleSignup")
            .addEventListener(
                "click",
                signInWithGoogle
            );

    </script>

</body>

</html>
