    <style>

        .temporary-page {
            min-height: 100vh;
            box-sizing: border-box;
            padding: 150px 6% 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .temporary-container {
            width: min(900px, 100%);
            text-align: center;
        }

        .temporary-title {
            margin: 0 0 3rem;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 1;
            font-weight: 600;
            color: #ffffff;
        }

        .temporary-card {
            padding: clamp(2rem, 5vw, 4rem);
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.025);
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .temporary-image {
            display: block;
            width: min(500px, 100%);
            max-height: 500px;
            object-fit: contain;
            margin: 0 auto 3rem;
        }

        .temporary-message {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 600;
            color: #ffffff;
        }

        .temporary-note {
            margin: 1.5rem auto 0;
            max-width: 650px;
            font-family: "Inter", sans-serif;
            font-size: clamp(0.95rem, 1.5vw, 1.15rem);
            line-height: 1.8;
            font-weight: 300;
            color: rgba(255,255,255,0.72);
        }

    </style>

</head>
